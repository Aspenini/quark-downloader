name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Slint needs fontconfig/xcb/xkbcommon; the native backends need GTK 4 and Qt 6.
          sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev \
            libgtk-4-dev qt6-base-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Docs (complete, no broken links)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build (release)
        run: cargo build --workspace --release

      - name: Check native Cocoa backend (macOS)
        if: runner.os == 'macOS'
        run: cargo clippy -p quark-gui --all-targets --features native-cocoa -- -D warnings

      - name: Check native Windows backend (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy -p quark-gui --all-targets --features native-windows -- -D warnings

      # GTK 4 and Qt Widgets (`kirigami`) are cross-platform, but linking them
      # needs their system libraries; the Linux runner has both via apt.
      - name: Check native GTK backend (Linux)
        if: runner.os == 'Linux'
        run: cargo clippy -p quark-gui --all-targets --features native-gtk -- -D warnings

      - name: Check native Qt backend (Linux)
        if: runner.os == 'Linux'
        run: cargo clippy -p quark-gui --all-targets --features native-kirigami -- -D warnings
