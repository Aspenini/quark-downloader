[package]
name = "quark-downloader-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "quark-downloader-gui"
path = "src/main.rs"

[features]
# Opt into native GUI backends (selectable at runtime via `gui_backend`).
native-cocoa = ["quark-gui/native-cocoa"]
native-windows = ["quark-gui/native-windows"]
native-gtk = ["quark-gui/native-gtk"]

[dependencies]
quark-core = { path = "../quark-core" }
quark-gui = { path = "../quark-gui" }
crossbeam-channel = { workspace = true }
