[package]
name = "quark-gui-cosmic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Quark Downloader COSMIC frontend (libcosmic; compiled into quark-downloader-gui)"
publish = false

[lib]
name = "quark_gui_cosmic"
path = "src/lib.rs"

[dependencies]
quark-core = { path = "../quark-core" }
quark-gui = { path = "../quark-gui" }

# Linux only: official COSMIC toolkit (native theme + frosted glass).
[target.'cfg(target_os = "linux")'.dependencies]
futures = "0.3"
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = [
    "dbus-config",
    "tokio",
    "winit",
    "wayland",
    "wgpu",
    "x11",
] }
