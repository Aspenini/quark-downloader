[package]
name = "quark-gui-cosmic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Quark Downloader COSMIC frontend (iced, the toolkit under libcosmic; system Wayland/Vulkan)"
publish = false

[[bin]]
name = "quark-downloader-gui-cosmic"
path = "src/main.rs"

[dependencies]
quark-gui = { path = "../quark-gui" }

# Linux only: iced dynamically links system Wayland/Vulkan via wgpu.
# Not pulled into the dispatcher or GTK/Win32 binaries.
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "wgpu"] }
