[package]
name = "quark-gui-cosmic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Quark Downloader COSMIC frontend (iced; compiled into quark-downloader-gui)"
publish = false

[lib]
name = "quark_gui_cosmic"
path = "src/lib.rs"

[dependencies]
quark-gui = { path = "../quark-gui" }

# Linux only: iced dynamically links system Wayland/Vulkan via wgpu.
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "wgpu"] }
